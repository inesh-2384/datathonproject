services:
  - type: web
    name: financial-immune-system
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIS_SIMULATION_SEED
        value: "42091"
      - key: FIS_RUNTIME_QUALIFICATION
        value: "LOCAL_SIMULATION [TARGET: IBM Z TELUM II / LINUXONE]"
